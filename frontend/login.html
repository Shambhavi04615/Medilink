<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediLink Chain - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background: #ffffff;
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        /* ---------------------------
           TOP HALF IMAGE
        ---------------------------- */
        .top-section {
            width: 100%;
            height: 50vh;
            background-image: url('media/p8.png'); /* REPLACE WITH YOUR IMAGE */
            background-size: cover;
            background-position: center;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ---------------------------
           FLOATING LOGIN CARD
        ---------------------------- */
        .login-wrapper {
            position: relative;
            top: -90px; /* This pulls the card upwards so it overlaps the image */
            margin-bottom: -60px;
        }

        .login-card {
            width: 620px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.18);
            animation: cardFade 0.7s ease;
        }

        @keyframes cardFade {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .login-card h3 {
            color: #a3031f;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-login {
            background: #a3031f;
            color: white;
            width: 100%;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #d90429;
        }

        .google-btn {
            width: 100%;
            background: white;
            border: 1px solid #a3031f;
            color: #a3031f;
            font-weight: 600;
        }

        .google-btn:hover {
            background: #d90429;
            color: white;
        }

        .footer {
            background: #a3031f;
            color: white;
            padding: 50px;
            margin-top: 80px;
        }

        .footer a {
            color: white;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- TOP IMAGE SECTION -->
    <div class="top-section"></div>

    <!-- FLOATING LOGIN CARD -->
    <div class="login-wrapper">
        <div class="login-card">

            <h3>Login</h3>

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control" placeholder="Enter your email" />
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control" placeholder="Enter password" />
            </div>

            <!-- ROLE DROPDOWN -->
            <div class="mb-3">
                <label class="form-label">Select Role</label>
                <select id="role" class="form-control">
                    <option value="">Select...</option>
                    <option value="manufacturer">Manufacturer</option>
                    <option value="pharmacist">Pharmacist</option>
                    <option value="customer">Customer</option>
                </select>
            </div>

            <!-- LOGIN BUTTON -->
            <button class="btn btn-login mt-2" onclick="loginUser()">Login</button>

            <!-- REGISTER LINK -->
            <p class="text-center mt-3">
                Don't have an account?
                <a href="register.html" style="color:#d90429; font-weight:600;">Register here</a>
            </p>

            <hr>

            <!-- GOOGLE LOGIN -->
            <button class="google-btn py-2 mb-3" onclick="googleLogin()">
                Continue With Google
            </button>

            <hr>

            <h6 class="text-center mb-2">Or Authorize Using Token</h6>

            <input id="manualToken" type="text" class="form-control mb-3" placeholder="Paste JWT Token" />

            <button class="btn btn-dark w-100" onclick="authorizeToken()">Authorize</button>

        </div>
    </div>

    <!-- FOOTER -->
    <section class="footer">
        <div class="row">

            <div class="col-md-4">
                <h5>Contact</h5>
                <p>Shambhavi Govindpurkar<br>Pune, Maharashtra , 411048</p>
                <p>Phone: 9423077599</p>
                <p>Email: shambhavi.govindpurkar24@vit.edu</p>
            </div>

            <div class="col-md-4">
                <h5>Quick Links</h5>
                <a href="#">Terms & Conditions</a><br>
                <a href="#">Privacy Policy</a>
            </div>

            <div class="col-md-4">
                <h5>Follow Us</h5>
                <a href="#">LinkedIn</a><br>
            </div>

        </div>

        <div class="text-center mt-4">
            © 2025 MediLink Chain. All rights reserved.
        </div>
    </section>

    <!-- FRONTEND JS -->
   <script>
    const API_BASE = "http://localhost:8000";

    /* =========================================================
       SAVE USER INFO (name, role, token)
    ========================================================== */
    function saveUserInfo(data) {
        localStorage.setItem("token", data.access_token);
        localStorage.setItem("name", data.name);
        localStorage.setItem("role", data.role);
        localStorage.setItem("user_id", data.user_id);
    }


    /* =========================================================
       NORMAL LOGIN
    ========================================================== */
    async function loginUser() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const role = document.getElementById("role").value;

        if (!email || !password || !role) {
            alert("Please fill all fields.");
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/users/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (!response.ok) {
                alert(data.detail || "Login failed");
                return;
            }

            // Save user data
            saveUserInfo(data);

            // Redirect by role
            redirectToDashboard(data.role);

        } catch (error) {
            alert("Server error");
        }
    }


    /* =========================================================
       GOOGLE LOGIN → redirect to backend OAuth
    ========================================================== */
    function googleLogin() {
        window.location.href = `${API_BASE}/auth/google/login`;
    }


    /* =========================================================
       GOOGLE LOGIN CALLBACK HANDLER (IF FRONTEND USES HASH URL)
    ========================================================== */
    window.onload = function () {
        // Example callback URL:
        // http://localhost:5500/#/auth/google/success?token=XYZ&name=John&role=customer

        if (window.location.hash.includes("auth/google/success")) {
            const params = new URLSearchParams(window.location.hash.split("?")[1]);

            const token = params.get("token");
            const name = params.get("name");
            const role = params.get("role");

            if (token) {
                localStorage.setItem("token", token);
                localStorage.setItem("name", name || "User");
                localStorage.setItem("role", role || "customer");

                redirectToDashboard(role);
            }
        }
    };


    /* =========================================================
       MANUAL TOKEN AUTHORIZATION
    ========================================================== */
    async function authorizeToken() {
        const token = document.getElementById("manualToken").value.trim();

        if (!token) {
            alert("Please enter a token.");
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/users/me`, {
                method: "GET",
                headers: { "Authorization": `Bearer ${token}` }
            });

            const user = await response.json();

            if (!response.ok) {
                alert(user.detail || "Invalid token");
                return;
            }

            // Save user info manually
            localStorage.setItem("token", token);
            localStorage.setItem("name", user.name);
            localStorage.setItem("role", user.role);
            localStorage.setItem("user_id", user.user_id);

            redirectToDashboard(user.role);

        } catch (error) {
            alert("Authorization failed");
        }
    }


    /* =========================================================
       ROLE-BASED REDIRECT
    ========================================================== */
    function redirectToDashboard(role) {
        if (role === "manufacturer") window.location.href = "manufacturer_dashboard.html";
        if (role === "pharmacist") window.location.href = "pharmacist_dashboard.html";
        if (role === "customer") window.location.href = "customer_dashboard.html";
    }

</script>


</body>
</html>
