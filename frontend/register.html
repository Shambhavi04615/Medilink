<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediLink Chain - Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background: #ffffff;
            font-family: "Poppins", sans-serif;
            overflow-x: hidden;
        }

        /* TOP IMAGE ------------------------ */
        .top-section {
            width: 100%;
            height: 40vh;
            background-image: url('media/p8.png'); /* replace with your own */
            background-size: cover;
            background-position: center;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* FLOATING CARD -------------------- */
        .register-wrapper {
            position: relative;
            top: -90px;
            margin-bottom: -60px;
        }

        .register-card {
            width: 620px;
            margin: auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.15);
            animation: cardFade 0.7s ease;
        }

        @keyframes cardFade {
            from { transform: translateY(10px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .register-card h3 {
            color: #a3031f;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }

        .btn-register {
            background: #a3031f;
            color: white;
            width: 100%;
            font-weight: 600;
        }

        .btn-register:hover {
            background: #a3031f;
        }

        .footer {
            background: #a3031f;
            color: white;
            padding: 50px;
            margin-top: 80px;
        }

        .footer a {
            color: white;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <!-- TOP IMAGE -->
    <div class="top-section"></div>

    <!-- FLOATING REGISTER CARD -->
    <div class="register-wrapper">
        <div class="register-card">

            <h3>Create an Account</h3>

            <!-- NAME -->
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input id="name" type="text" class="form-control" placeholder="Enter full name" />
            </div>

            <!-- EMAIL -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input id="email" type="email" class="form-control" placeholder="Enter your email" />
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input id="password" type="password" class="form-control" placeholder="Enter password" />
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input id="confirmPassword" type="password" class="form-control" placeholder="Confirm your password" />
            </div>

            <!-- ROLE DROPDOWN -->
            <div class="mb-3">
                <label class="form-label">Select Role</label>
                <select id="role" class="form-control">
                    <option value="">Select...</option>
                    <option value="manufacturer">Manufacturer</option>
                    <option value="pharmacist">Pharmacist</option>
                    <option value="customer">Customer</option>
                </select>
            </div>

            <!-- REGISTER BUTTON -->
            <button class="btn btn-register mt-2" onclick="registerUser()">Register</button>

            <!-- LOGIN REDIRECT -->
            <p class="text-center mt-3">
                Already have an account?
                <a href="login.html" style="color:#d90429; font-weight:600;">Login here</a>
            </p>

        </div>
    </div>

    <!-- FOOTER -->
    <section class="footer">
        <div class="row">

            <div class="col-md-4">
                <h5>Contact</h5>
                <p>500 Terry Francine Street<br>San Francisco, CA 94158</p>
                <p>Phone: 123-456-7890</p>
                <p>Email: info@medilink.com</p>
            </div>

            <div class="col-md-4">
                <h5>Quick Links</h5>
                <a href="#">Terms & Conditions</a><br>
                <a href="#">Privacy Policy</a>
            </div>

            <div class="col-md-4">
                <h5>Follow Us</h5>
                <a href="#">LinkedIn</a><br>
                <a href="#">YouTube</a><br>
                <a href="#">Facebook</a>
            </div>

        </div>

        <div class="text-center mt-4">
            © 2025 MediLink Chain. All rights reserved.
        </div>
    </section>

    <!-- JS LOGIC -->
    <script>
        const API_BASE = "http://localhost:8000";

        async function registerUser() {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const confirmPassword = document.getElementById("confirmPassword").value.trim();
            const role = document.getElementById("role").value;

            // Form validation
            if (!name || !email || !password || !confirmPassword || !role) {
                alert("Please fill all fields.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return;
            }

            if (password.length < 6) {
                alert("Password must be at least 6 characters.");
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/users/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.detail || "Registration failed.");
                    return;
                }

                alert("Registration successful! Please log in.");
                window.location.href = "login.html";

            } catch (error) {
                alert("Server error.");
            }
        }
    </script>

</body>
</html>
